<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PJK Learning Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@700&family=Oswald:wght@700&family=Raleway:wght@700&family=Poppins:wght@700&family=Noto+Serif+JP:wght@700&family=Righteous&family=Zen+Antique+Soft&family=M+PLUS+1p:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <button class="main-menu-btn" type="button">Main Menu</button>
    <h1 class="title">PJK Learning Center</h1>
    <button class="menu-btn" id="menuBtn">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings</h2>
        <button class="close-btn" id="closeModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="option-label">Quiz Modes</div>
        <div class="quiz-options menu-options">
          <button class="quiz-btn" data-mode="flashcards">Flash Cards</button>
          <button class="quiz-btn" data-mode="multiplechoice">Multiple Choice</button>
          <button class="quiz-btn" data-mode="bottlerecognition">Bottle Recognition</button>
          <button class="quiz-btn" data-mode="builddrink">Build a Drink</button>
          <button class="quiz-btn" data-mode="qnaresponses">Q&A Responses</button>
        </div>

        <div class="option-label">Themes</div>
        <div class="theme-options menu-options">
          <button class="theme-btn" data-theme="original">Original</button>
          <button class="theme-btn" data-theme="dark">Dark</button>
          <button class="theme-btn" data-theme="light">Light</button>
          <button class="theme-btn" data-theme="pipboy">Pip-Boy</button>
          <button class="theme-btn" data-theme="cyberpunk">Cyberpunk</button>
        </div>
      </div>
    </div>
  </div>
  <div class="container" id="mainContainer"></div>
  <script src="script.js"></script>
</body>
</html>
